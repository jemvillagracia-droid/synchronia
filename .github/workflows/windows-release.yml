# Builds the Windows installer on GitHub's Windows machines and publishes it.
#
#  * Push to main -> tests, installer build, smoke test of the built app. If version X.Y.Z in package.json has no
#    published release yet, release "vX.Y.Z" is published (the tag is created here) with SYNCHRONIA-Setup-X.Y.Z.exe
#    attached; a draft release for that version is filled in and published instead. So: bump the version, push, and
#    the new installer appears on the Releases page.
#  * Push a version tag (vX.Y.Z) or publish a release by hand -> the same, always (re)attaching the installer.
#  * "Run workflow" on the Actions tab -> the same build; the installer is kept as a run artifact for 30 days.
#
# Release notes come from docs/releases/vX.Y.Z.md when that file exists; otherwise GitHub writes them from the commits.
name: Windows release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', '**/*.md']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The web build comes first: the security tests check the headers on the app's own page.
      - run: npm run build
      - run: npm test

  build:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Read version
        id: ver
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          tag=""
          if [ "${{ github.event_name }}" = "release" ]; then tag="${{ github.event.release.tag_name }}"; fi
          if [ "${{ github.ref_type }}" = "tag" ]; then tag="${{ github.ref_name }}"; fi
          if [ -n "$tag" ] && [ "${tag#v}" != "$version" ]; then
            echo "::error::Tag $tag does not match package.json version $version. Bump the version or retag."
            exit 1
          fi
          echo "Building SYNCHRONIA $version"

      - run: npm ci
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Smoke test the built app
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP "synchronia-smoke"
          $env:SYNCHRONIA_DATA_DIR = $data
          $p = Start-Process -FilePath "release\win-unpacked\SYNCHRONIA.exe" -PassThru
          Start-Sleep -Seconds 30
          $alive = -not $p.HasExited
          Get-Process SYNCHRONIA -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3
          if (-not $alive) { Write-Error "The app exited early (exit code $($p.ExitCode))"; exit 1 }
          $db = Join-Path $data "synchronia.db"
          if (-not (Test-Path $db)) { Write-Error "The app did not create its database"; exit 1 }
          node --disable-warning=ExperimentalWarning scripts/smoke-check-db.cjs "$db"
          if ($LASTEXITCODE -ne 0) { Write-Error "The database was not fully set up"; exit 1 }
          Write-Host "App started, set up its database and ran for 30 s."

      - name: Keep the installer with this run
        uses: actions/upload-artifact@v4
        with:
          name: SYNCHRONIA-Setup-${{ steps.ver.outputs.version }}
          path: release/SYNCHRONIA-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish or update the GitHub release
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.ver.outputs.version }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          tag="v$VERSION"
          exe="release/SYNCHRONIA-Setup-$VERSION.exe"
          notes="docs/releases/$tag.md"
          # A release for this version, drafts included (a draft's tag does not exist yet, so match on tag_name).
          rel=$(gh api "repos/$REPO/releases?per_page=100" --jq "[.[] | select(.tag_name == \"$tag\")][0] | select(.) | \"\(.id) \(.draft)\"")
          if [ -z "$rel" ]; then
            if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
            gh release create "$tag" "$exe" --repo "$REPO" --target "$GITHUB_SHA" --title "SYNCHRONIA $VERSION" "$@"
            echo "Published $tag with the installer."
            exit 0
          fi
          id=${rel%% *}; draft=${rel#* }
          if [ "$draft" = "false" ] && [ "$EVENT" = "push" ] && [ "$REF_TYPE" != "tag" ]; then
            echo "$tag is already published; nothing to do (push the tag or publish a release to replace its installer)."
            exit 0
          fi
          gh release upload "$tag" "$exe" --repo "$REPO" --clobber
          if [ "$draft" = "true" ]; then
            body=()
            if [ -f "$notes" ] && [ -z "$(gh api "repos/$REPO/releases/$id" --jq '.body // ""')" ]; then body=(-F "body=@$notes"); fi
            gh api -X PATCH "repos/$REPO/releases/$id" -F draft=false -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" "${body[@]}" > /dev/null
            echo "Published the draft $tag with the installer."
          else
            echo "Attached the installer to $tag."
          fi
